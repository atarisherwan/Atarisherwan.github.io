<!doctype html>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#f5faff;background:#060d19}
body{background:#060d19;background-image:radial-gradient(ellipse at 50% 18%,#16304a 0%,#09172a 50%,#060d19 95%);overflow-x:hidden}

.shell{position:relative;max-width:920px;margin:0 auto;min-height:610px;padding:47px 26px 76px;text-align:center}

.halo:before{content:"";position:absolute;top:12px;right:12px;bottom:12px;left:12px;border:1px dashed #387db3;border-radius:50%;animation:spin 35s linear infinite}
.halo:after{content:"";position:absolute;top:-5px;right:-5px;bottom:-5px;left:-5px;border-radius:50%;border-top:3px solid #52d0ff;border-right:3px solid transparent;border-bottom:3px solid transparent;border-left:3px solid transparent;animation:spin 5s linear infinite;box-shadow:0 -4px 17px rgba(71,196,252,.21)}
.emblem{position:absolute;left:34px;top:34px;width:158px;height:158px;border-radius:50%;background:linear-gradient(160deg,#193f62,#081421);border:1px solid #3c779f;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 44px rgba(15,83,141,.20)}
.monogram{font-size:63px;color:#fff;font-weight:900;letter-spacing:-6px;margin-right:8px;text-shadow:0 0 26px rgba(141,209,255,.30)}
.status{font-size:17px;color:#fff;letter-spacing:2.5px;font-weight:800;margin-top:2px;min-height:24px}
.caption{font-size:12px;color:#789bb8;margin:12px 0 25px;letter-spacing:1.4px;min-height:14px}
.progress{height:5px;width:86%;max-width:420px;background:#1a3048;border-radius:12px;margin:0 auto;overflow:hidden}
.progress i{height:100%;width:28%;display:block;background:linear-gradient(90deg,#2b83d7,#6ee7e8);border-radius:10px;box-shadow:0 0 15px #38bdf8;animation:flow 1.6s ease-in-out infinite}
.meta{max-width:480px;display:flex;justify-content:space-between;align-items:center;margin:31px auto 0;padding:18px 16px;border-top:1px solid #26425b;color:#79a0c2;font-size:12px;letter-spacing:1px;text-align:left}
.meta b{display:block;margin-top:7px;font-size:16px;color:#f1f6ff;font-weight:700;letter-spacing:1px}
.meta .right{text-align:right}
.footer{padding:0 16px 25px;text-align:center;color:#52738c;font-size:10px;letter-spacing:2px}
.demo{display:none;margin:12px auto 0;color:#f0ca86;font-size:11px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{0%{transform:translateX(-120%)}100%{transform:translateX(470%)}}
@media(max-width:650px){.shell{min-height:560px;padding:38px 15px 48px}.brand{font-size:37px;letter-spacing:1px}.brand-top{letter-spacing:3px}.subtitle{letter-spacing:2px;font-size:11px}.emblem-wrap{margin-top:37px}.meta{margin-top:26px}.status{font-size:14px}}
