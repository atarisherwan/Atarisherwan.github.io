<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATARI SHERWAN — 10.xx TEST</title>
<style>html,body{margin:0;background:#07101d;color:#e9f5ff;font:16px Arial,sans-serif;min-height:100%}
main{max-width:650px;margin:0 auto;padding:36px 18px;text-align:center}
img{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto 20px}
h1{font-size:25px}p{line-height:1.65;color:#b3c5d7}
button{padding:14px 22px;color:white;background:#245990;border:0;border-radius:8px;font:17px Arial;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}#ver{color:#6dd3ff}</style></head>
<body><main><img alt="Atari Sherwan logo" src="../assets/sherwan-symbol.png">
<h1>ATARI SHERWAN</h1><p>Separate experimental PS4 10.xx host.</p>
<p>Detected firmware: <b id="ver">...</b></p>
<p>For 10.00, 10.01, 10.70 and 10.71 only.<br>Hardware success is NOT VERIFIED. Do not run on a console with important data.</p>
<button id="btn" disabled>OPEN EXPERIMENTAL HOST</button>
<script>(function(){var m=/PlayStation\s*4[\/ ](\d+)\.(\d+)/i.exec(navigator.userAgent||'');
var fw=m?Number(m[1])+'.'+m[2].padStart(2,'0'):'UNKNOWN';
document.getElementById('ver').textContent=fw;
if(['10.00','10.01','10.70','10.71'].indexOf(fw)!==-1){
var b=document.getElementById('btn');b.disabled=false;
b.onclick=function(){location.href='webkitty/index.html';};}})();</script></main></body></html>
