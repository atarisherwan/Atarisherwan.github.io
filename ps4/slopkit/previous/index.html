<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation Slopkit Host</title>
    <link rel="icon" type="image/png" href="../../pstation.png">
    <style>
        :root {
            --bg: #050706;
            --panel: #080c0a;
            --raised: #0d1510;
            --line: #34443a;
            --line-bright: #607b68;
            --text: #f1f6f2;
            --muted: #b4c1b8;
            --dim: #86958b;
            --green: #73f5a6;
            --red: #ff9b9b;
            --yellow: #e4d27b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--bg);
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background-color: var(--bg);
            background-image:
                linear-gradient(
                    rgba(115, 245, 166, 0.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(115, 245, 166, 0.03) 1px,
                    transparent 1px
                );
            background-size: 32px 32px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            font: 16px/1.5
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex: 1 0 auto;
            flex-direction: column;
            justify-content: center;
            margin: 0 auto;
            padding: 24px 0 20px;
            width: min(100% - 64px, 1120px);
        }

        .header-section,
        .status-container,
        .controls-section {
            background: rgba(8, 12, 10, 0.92);
            border: 1px solid var(--line);
        }

        .header-section {
            margin-bottom: 12px;
            padding: 20px 28px 22px;
            position: relative;
        }

        .header-section::before {
            color: var(--green);
            content: "●  PS4 / SLOPKIT HOST";
            display: block;
            font-size: 13px;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }

        .header-section::after {
            color: var(--dim);
            content: "SYS / READY   //   MANUAL MODE";
            font-size: 12px;
            letter-spacing: 0.08em;
            position: absolute;
            right: 28px;
            top: 21px;
        }

        .main-title {
            color: var(--text);
            font-size: clamp(30px, 5vw, 50px);
            font-weight: 400;
            letter-spacing: -0.07em;
            line-height: 1.05;
        }

        .main-title::before {
            color: var(--green);
            content: "> ";
        }

        .subtitle {
            color: var(--green);
            font-size: 16px;
            margin-top: 12px;
        }

        .version-info {
            color: var(--muted);
            font-size: 14px;
            margin-top: 7px;
        }

        #UA {
            color: var(--dim);
            display: block;
            font-size: 12px;
            margin-top: 7px;
            overflow-wrap: anywhere;
        }

        #cache {
            color: var(--dim);
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            min-height: 24px;
            overflow-wrap: anywhere;
        }

        #cache.cacheok {
            color: var(--green);
        }

        .status-container {
            color: var(--muted);
            padding: 14px 18px;
        }

        .status-label,
        .section-title {
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
            padding-bottom: 9px;
            text-transform: uppercase;
        }

        #console {
            background: var(--panel);
            border: 1px solid var(--line-bright);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            line-height: 1.45;
            max-height: 132px;
            min-height: 42px;
            overflow: auto;
            padding: 10px 14px;
            white-space: pre-wrap;
        }

        .controls-section {
            margin-top: 12px;
            padding: 16px 18px;
        }

        #kernel-options {
            align-items: center;
            display: flex !important;
            flex-wrap: wrap;
            gap: 10px 14px;
        }

        .chain-label,
        .auto-jb-label {
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .chain-options {
            display: flex;
            gap: 8px;
        }

        #kernel-options input[type="radio"] {
            height: 1px;
            opacity: 0;
            position: absolute;
            width: 1px;
        }

        .chain-option,
        #jeilbrek {
            background: var(--panel);
            border: 1px solid var(--line-bright);
            border-radius: 0;
            color: var(--text);
            cursor: pointer;
            font: inherit;
            min-height: 42px;
            padding: 8px 12px;
            transition:
                background-color 160ms ease,
                border-color 160ms ease,
                color 160ms ease;
        }

        #kernel-options input[type="radio"]:focus + .chain-option,
        #kernel-options input[type="radio"]:checked + .chain-option,
        .chain-option:hover,
        #jeilbrek:hover,
        #jeilbrek:focus {
            background: var(--raised);
            border-color: var(--green);
            color: var(--green);
            outline: none;
        }

        #kernel-options input[type="radio"]:disabled + .chain-option,
        #kernel-options input[type="radio"]:disabled + .chain-option:hover {
            background: var(--panel);
            border-color: var(--line);
            color: var(--dim);
            cursor: not-allowed;
            opacity: 0.45;
        }

        #jeilbrek {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }

        #jeilbrek:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        .auto-jb {
            align-items: center;
            display: inline-flex;
            width: fit-content;
        }

        .auto-jb-label {
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--line-bright);
            border-radius: 0;
            color: var(--text);
            cursor: pointer;
            display: inline-flex;
            font-size: 14px;
            gap: 8px;
            min-height: 42px;
            padding: 8px 12px;
            text-transform: none;
            white-space: nowrap;
            width: fit-content;
            transition:
                background-color 160ms ease,
                border-color 160ms ease,
                color 160ms ease;
        }

        .auto-jb-label:hover {
            background: var(--raised);
            border-color: var(--green);
            color: var(--green);
        }

        #autoJbInput {
            accent-color: var(--green);
            height: 18px;
            margin: 0;
            width: 18px;
            flex: 0 0 auto;
        }

        #autoJbCountdown {
            color: var(--white);
            display: inline;
            font-size: 13px;
            margin-left: 2px;
            min-width: 0;
            white-space: nowrap;
        }

        .credits {
            border-top: 1px solid var(--line);
            color: var(--muted);
            flex: 0 0 auto;
            font-size: 13px;
            margin: 0 auto;
            padding: 8px 20px 10px;
            text-align: center;
            width: min(100% - 64px, 1120px);
        }

        .credits a {
            color: var(--text);
        }

        .credits a:hover,
        .credits a:focus {
            color: var(--green);
        }

        .credits-line {
            display: inline;
        }

        .credits-line + .credits-line::before {
            color: var(--line-bright);
            content: "  //  ";
        }

        .credit-label {
            color: var(--muted);
        }

        @media (max-width: 820px) {
            body {
                overflow: auto;
            }

            .container {
                justify-content: flex-start;
                padding: 24px 0 20px;
                width: min(100% - 32px, 560px);
            }

            .header-section {
                padding: 20px 18px 22px;
            }

            .header-section::after {
                display: none;
            }

            .main-title {
                font-size: clamp(30px, 9vw, 44px);
            }

            #kernel-options {
                align-items: flex-start;
                flex-direction: column;
            }

            .chain-options {
                width: 100%;
            }

            .chain-option {
                flex: 1;
            }

            #jeilbrek {
                width: 100%;
            }

            .auto-jb {
                width: fit-content;
            }

            .auto-jb-label {
                width: fit-content;
            }

            .credits-line {
                display: block;
                margin: 4px 0;
            }

            .credits-line + .credits-line::before {
                content: "";
            }
        }

        @media (max-width: 430px) {
            .chain-options {
                width: 100%;
            }

            .chain-option {
                flex: 1;
            }

            #jeilbrek {
                width: 100%;
            }

            .auto-jb {
                width: 100%;
            }

            .auto-jb-label {
                width: fit-content;
                max-width: 100%;
            }

            .main-title {
                font-size: 30px;
            }
        }
    </style>

    <script>
        var POOPS_MIN_FIRMWARE = 12.50;
        var POOPS_MAX_FIRMWARE = 13.00;

        var LAPSE_FIRMWARES = [
            11.00,
            11.50,
            11.52,
            12.00,
            12.02
        ];
    </script>

    <script>
        (function () {
            var consoleEl =
                document.getElementById("console");

            var jailbreakBtn =
                document.getElementById("jeilbrek");

            var radios =
                document.querySelectorAll(
                    'input[name="kernel"]'
                );

            var autoJbInput =
                document.getElementById("autoJbInput");

            var autoJbCountdown =
                document.getElementById("autoJbCountdown");

            var uaEl =
                document.getElementById("UA");

            var selectedBug = null;
            var autoJailbreakTimer = null;

            var key = null;
            var fwnum = null;

            var m =
                /PlayStation\s+4[\/ ](\d+)\.(\d+)/i.exec(
                    navigator.userAgent
                );

            if (m) {
                var major =
                    parseInt(m[1], 10);

                var minor =
                    parseInt(m[2], 10);

                key =
                    major + "." + minor;

                fwnum =
                    major * 100 + minor;
            }

            if (key) {
                uaEl.textContent =
                    "Running on: PS4 Firmware " +
                    key +
                    " | " +
                    navigator.userAgent;
            } else {
                uaEl.textContent =
                    "Running on: Unknown device | " +
                    navigator.userAgent;
            }

            for (
                var i = 0;
                i < radios.length;
                i++
            ) {
                radios[i].addEventListener(
                    "change",
                    function () {
                        selectedBug =
                            this.value;

                        jailbreakBtn.disabled =
                            false;

                        consoleEl.textContent =
                            selectedBug.toUpperCase() +
                            " Ready to launch.";

                        if (autoJbInput.checked) {
                            startAutoJailbreak();
                        }
                    }
                );
            }

            function go() {
                var firmwareMatch =
                    navigator.userAgent.match(
                        /PlayStation\s+4[\/ ](\d+)\.(\d+)/i
                    );

                if (firmwareMatch) {
                    var firmware =
                        parseFloat(
                            firmwareMatch[1] +
                            "." +
                            firmwareMatch[2]
                        );

                    var isPoopsFirmware =
                        firmware >= POOPS_MIN_FIRMWARE &&
                        firmware <= POOPS_MAX_FIRMWARE;

                    var isLapseFirmware =
                        LAPSE_FIRMWARES.indexOf(firmware) !== -1;

                    if (
                        isPoopsFirmware &&
                        selectedBug === "lapse"
                    ) {
                        consoleEl.textContent =
                            "LAPSE is not supported on firmware " +
                            firmware.toFixed(2) +
                            ".\nUse POOPS instead.";

                        return;
                    }

                    if (
                        isLapseFirmware &&
                        selectedBug === "poops"
                    ) {
                        consoleEl.textContent =
                            "POOPS is not supported on firmware " +
                            firmware.toFixed(2) +
                            ".\nUse LAPSE instead.";

                        return;
                    }
                }

                if (!selectedBug) {
                    consoleEl.textContent =
                        "No kernel chain selected.\n" +
                        "Select Lapse or Poops first.";

                    return;
                }

                localStorage.setItem(
                    "selectedExploit",
                    selectedBug
                );

                var target =
                    selectedBug === "lapse"
                        ? "run_lapse.html"
                        : "run_poops.html";

                if (location.search) {
                    target += location.search;
                }

                consoleEl.textContent =
                    selectedBug.toUpperCase() +
                    " Loading exploit chain...";

                jailbreakBtn.disabled = true;

                setTimeout(
                    function () {
                        location.replace(target);
                    },
                    100
                );
            }

            jailbreakBtn.addEventListener(
                "click",
                go
            );

            function startAutoJailbreak() {
                if (!selectedBug) {
                    return;
                }

                if (autoJailbreakTimer !== null) {
                    clearInterval(
                        autoJailbreakTimer
                    );

                    autoJailbreakTimer = null;
                }

                var countdown = 3;

                autoJbCountdown.textContent =
                    "in: " + countdown;

                autoJailbreakTimer =
                    setInterval(
                        function () {
                            countdown--;

                            if (countdown > 0) {
                                autoJbCountdown.textContent =
                                    "in: " + countdown;
                            } else {
                                clearInterval(
                                    autoJailbreakTimer
                                );

                                autoJailbreakTimer = null;

                                autoJbCountdown.textContent = "";

                                go();
                            }
                        },
                        1000
                    );
            }

            autoJbInput.addEventListener(
                "change",
                function () {
                    if (
                        this.checked &&
                        selectedBug
                    ) {
                        startAutoJailbreak();
                    } else if (!this.checked) {
                        if (autoJailbreakTimer !== null) {
                            clearInterval(
                                autoJailbreakTimer
                            );

                            autoJailbreakTimer = null;
                        }

                        autoJbCountdown.textContent = "";
                    }
                }
            );
        })();
    </script>

    <script>
        (function () {
            function getFirmware() {
                var match =
                    navigator.userAgent.match(
                        /PlayStation\s+4[\/ ](\d+)\.(\d+)/i
                    );

                if (!match) {
                    return null;
                }

                return parseFloat(
                    match[1] + "." + match[2]
                );
            }

            function validateExploitChain() {
                var firmware =
                    getFirmware();

                var lapse =
                    document.getElementById(
                        "lapse-exploit"
                    );

                var poops =
                    document.getElementById(
                        "poops-exploit"
                    );

                if (!lapse || !poops) {
                    return;
                }

                if (firmware === null) {
                    lapse.disabled = false;
                    poops.disabled = false;
                    return;
                }

                var isPoopsFirmware =
                    firmware >= POOPS_MIN_FIRMWARE &&
                    firmware <= POOPS_MAX_FIRMWARE;

                var isLapseFirmware =
                    LAPSE_FIRMWARES.indexOf(firmware) !== -1;

                if (isPoopsFirmware) {
                    lapse.disabled = true;
                    lapse.checked = false;

                    poops.disabled = false;
                    poops.checked = true;

                    poops.dispatchEvent(
                        new Event("change")
                    );

                    return;
                }

                if (isLapseFirmware) {
                    poops.disabled = true;
                    poops.checked = false;

                    lapse.disabled = false;
                    lapse.checked = true;

                    lapse.dispatchEvent(
                        new Event("change")
                    );

                    return;
                }

                lapse.disabled = false;
                poops.disabled = false;
            }

            validateExploitChain();
        })();
    </script>

    <script>
        (function () {
            var cacheEl =
                document.getElementById("cache");

            function setCache(text, ok) {
                if (!cacheEl) {
                    return;
                }

                cacheEl.textContent = text;
                cacheEl.className =
                    ok ? "cacheok" : "";
            }

            var ac =
                window.applicationCache;

            if (
                !ac ||
                !document.documentElement.hasAttribute(
                    "manifest"
                )
            ) {
                setCache(
                    "application cache unavailable"
                );
            } else if (!navigator.onLine) {
                setCache(
                    "offline -- using cached resources",
                    true
                );
            } else if (ac.status === ac.IDLE) {
                setCache(
                    "cached -- offline ready",
                    true
                );
            } else if (
                ac.status === ac.UPDATEREADY
            ) {
                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded -- offline ready",
                    true
                );
            } else {
                setCache(
                    "checking cache..."
                );

                ac.addEventListener(
                    "downloading",
                    function () {
                        setCache(
                            "caching for offline (first run)..."
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "progress",
                    function (e) {
                        if (e && e.total) {
                            setCache(
                                "caching " +
                                Math.round(
                                    (e.loaded / e.total) * 100
                                ) +
                                "%"
                            );
                        }
                    },
                    false
                );

                ac.addEventListener(
                    "cached",
                    function () {
                        setCache(
                            "cached for offline use disconnect to the internet first and rerun this page",
                            true
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "updateready",
                    function () {
                        try {
                            ac.swapCache();
                        } catch (e) {}

                        setCache(
                            "update downloaded -- offline ready",
                            true
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "noupdate",
                    function () {
                        setCache(
                            "cached -- offline ready",
                            true
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "error",
                    function () {
                        setCache(
                            "cache unavailable"
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "obsolete",
                    function () {
                        setCache(
                            "cache obsolete"
                        );
                    },
                    false
                );
            }
        })();
    </script>
    <script>
(function () {
    
    // var FIRMWARE_MODE = 'range';
    // var MIN_FIRMWARE = 13.02;
    // var MAX_FIRMWARE = 13.52;
    
    // var FIRMWARE_MODE = 'exact';
    // var REQUIRED_FIRMWARE = 6.72;

    var FIRMWARE_MODE = 'list';
    var ALLOWED_FIRMWARES = [11.00,11.50,11.52,12.00,12.02,12.50,12.52,13.00];

    function getRootSelector() {
      return '/webkit/';
    }

    function getPS4Firmware() {
        var ua = navigator.userAgent;
        if (/PlayStation 5/i.test(ua)) {
            return null;
        }
        if (!/PlayStation 4/i.test(ua)) {
            return null;
        }
        var match = ua.match(
            /PlayStation\s+4[\/ ](\d+)\.(\d+)/
        );
        if (!match) {
            return null;
        }
        return parseFloat(match[1] + "." + match[2]);
    }

    function isPS4() {
        var ua = navigator.userAgent;
        if (/PlayStation 5/i.test(ua)) {
            return false;
        }
        return /PlayStation 4/i.test(ua);
    }

    function isFirmwareSupported(firmware) {
        if (firmware === null) {
            return false;
        }

        if (FIRMWARE_MODE === 'exact') {
            return firmware === REQUIRED_FIRMWARE;
        }

        if (FIRMWARE_MODE === 'range') {
            return (
                firmware >= MIN_FIRMWARE &&
                firmware <= MAX_FIRMWARE
            );
        }

        if (FIRMWARE_MODE === 'list') {
            return ALLOWED_FIRMWARES.indexOf(firmware) !== -1;
        }
        return false;
    }

    function getSupportedFirmwareText() {
        if (FIRMWARE_MODE === 'exact') {
            return REQUIRED_FIRMWARE.toFixed(2);
        }

        if (FIRMWARE_MODE === 'range') {
            return (
                MIN_FIRMWARE.toFixed(2) +
                ' - ' +
                MAX_FIRMWARE.toFixed(2)
            );
        }

        if (FIRMWARE_MODE === 'list') {
            return ALLOWED_FIRMWARES
                .map(function (fw) {
                    return fw.toFixed(2);
                })
                .join(', ');
        }
        return 'UNKNOWN';
    }

    function showUnsupportedDevice() {
        document.documentElement.classList.add(
            'security-error'
        );
        var screen = document.createElement('div');
        screen.id = 'securityScreen';
        screen.innerHTML =
            '<div class="security-message">' +
                '<div class="security-title">' +
                    'UNSUPPORTED DEVICE' +
                '</div>' +
                '<div class="security-info">' +
                    'This page is only supported on PlayStation 4.' +
                '</div>' +
                '<div class="security-countdown">' +
                    'Redirecting to firmware selection in ' +
                    '<span id="securityCountdown">3</span>...' +
                '</div>' +
            '</div>';
        document.body.appendChild(screen);
        startCountdown();
    }

    function showUnsupportedFirmware(firmware) {
        document.documentElement.classList.add(
            'security-error'
        );
        var screen = document.createElement('div');
        screen.id = 'securityScreen';
        screen.innerHTML =
            '<div class="security-message">' +
                '<div class="security-title">' +
                    'FIRMWARE NOT SUPPORTED' +
                '</div>' +
                '<div class="security-info">' +
                    'Detected firmware: ' +
                    (
                        firmware !== null
                            ? firmware.toFixed(2)
                            : 'UNKNOWN'
                    ) +
                '</div>' +
                '<div class="security-info">' +
                    'Supported firmware: ' +
                    getSupportedFirmwareText() +
                '</div>' +
                '<div class="security-countdown">' +
                    'Redirecting to firmware selection in ' +
                    '<span id="securityCountdown">3</span>...' +
                '</div>' +
            '</div>';
        document.body.appendChild(screen);
        startCountdown();
    }

    function startCountdown() {
        var countdown = 3;
        var countdownElement =
            document.getElementById('securityCountdown');
        var timer = setInterval(function () {
            countdown--;
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href =
                    getRootSelector();
                return;
            }
            countdownElement.textContent =
                countdown;
        }, 1000);
    }

    var style = document.createElement('style');
    style.textContent = `
        html.security-error,
        html.security-error body {
            width: 100% !important;
            height: 100% !important;
            min-height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: #050706 !important;
        }
        
        html.security-error body > *:not(#securityScreen) {
            display: none !important;
        }

        #securityScreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050706;
            color: #73f5a6;
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
            text-align: center;
            z-index: 999999;
        }

        .security-message {
            width: min(90%, 700px);
            padding: 30px;
            border: 1px solid #34443a;
            background: #080c0a;
            box-shadow:
                0 0 30px rgba(115, 245, 166, 0.05);
        }

        .security-title {
            color: #73f5a6;
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 400;
            letter-spacing: 0.08em;
            margin-bottom: 22px;
        }

        .security-info {
            color: #b4c1b8;
            font-size: 14px;
            line-height: 1.7;
        }

        .security-countdown {
            color: #73f5a6;
            font-size: 15px;
            margin-top: 24px;
            letter-spacing: 0.04em;
        }

        #securityCountdown {
            color: #ffffff;
            font-size: 20px;
        }
    `;

    document.head.appendChild(style);
    var detectedFirmware = getPS4Firmware();

    if (!isPS4()) {
        showUnsupportedDevice();
        return;
    }

    if (!isFirmwareSupported(detectedFirmware)) {
        showUnsupportedFirmware(detectedFirmware);
        return;
    }
})();
</script>
